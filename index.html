<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>報告順序抽籤機</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
    min-height: 100vh;
    background: linear-gradient(-45deg, #ff6b6b, #feca57, #48dbfb, #1dd1a1, #5f27cd, #ff9ff3);
    background-size: 400% 400%;
    animation: gradientShift 15s ease infinite;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .container {
    background: rgba(255, 255, 255, 0.95);
    border-radius: 24px;
    padding: 40px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    max-width: 760px;
    width: 100%;
    text-align: center;
  }

  h1 {
    font-size: 2.6rem;
    background: linear-gradient(135deg, #ff6b6b, #5f27cd);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
  }

  .subtitle {
    color: #576574;
    margin-bottom: 30px;
    font-size: 1rem;
  }

  .students-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-bottom: 30px;
  }

  .student-card {
    padding: 18px 10px;
    border-radius: 16px;
    font-size: 1.15rem;
    font-weight: bold;
    color: white;
    transition: all 0.4s ease;
    position: relative;
    overflow: hidden;
    box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
  }

  .student-card.presented {
    opacity: 0.35;
    filter: grayscale(70%);
    transform: scale(0.95);
  }

  .student-card .badge {
    display: block;
    font-size: 0.8rem;
    margin-top: 6px;
    background: rgba(255, 255, 255, 0.3);
    border-radius: 10px;
    padding: 2px 6px;
  }

  .announcement {
    min-height: 140px;
    background: linear-gradient(135deg, #f5f7fa 0%, #e4e7eb 100%);
    border-radius: 16px;
    padding: 25px;
    margin-bottom: 25px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    border: 3px dashed #c8d6e5;
    transition: all 0.4s ease;
  }

  .announcement.active {
    background: linear-gradient(135deg, #fceabb 0%, #f8b500 100%);
    border-color: #ff6b6b;
    animation: pulse 1.2s ease-in-out;
  }

  .announcement.finished {
    background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
    border-color: #1dd1a1;
  }

  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.03); }
    100% { transform: scale(1); }
  }

  .picked-name {
    font-size: 2.8rem;
    font-weight: bold;
    background: linear-gradient(135deg, #ee5a6f, #5f27cd);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 10px;
    animation: bounce 0.6s ease;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
  }

  .message {
    font-size: 1.15rem;
    color: #2f3542;
    font-weight: 500;
  }

  .placeholder {
    font-size: 1.1rem;
    color: #8395a7;
  }

  .buttons {
    display: flex;
    gap: 15px;
    justify-content: center;
    flex-wrap: wrap;
  }

  button {
    padding: 16px 32px;
    font-size: 1.05rem;
    font-weight: bold;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.3s ease;
    color: white;
    box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
  }

  .draw-btn {
    background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
  }

  .draw-btn:hover:not(:disabled) {
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(238, 90, 111, 0.5);
  }

  .draw-btn:disabled {
    background: #c8d6e5;
    cursor: not-allowed;
    box-shadow: none;
  }

  .clear-btn {
    background: linear-gradient(135deg, #5f27cd, #341f97);
  }

  .clear-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(95, 39, 205, 0.5);
  }

  .input-btn {
    background: linear-gradient(135deg, #1dd1a1, #10ac84);
  }

  .input-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(29, 209, 161, 0.5);
  }

  button:active:not(:disabled) {
    transform: translateY(0);
  }

  .order-list {
    margin-top: 20px;
    padding: 15px;
    background: rgba(72, 219, 251, 0.1);
    border-radius: 12px;
    min-height: 40px;
    color: #2f3542;
    font-size: 0.95rem;
  }

  .order-list strong { color: #0abde3; }

  .rolling {
    animation: rollText 0.08s linear infinite;
  }

  @keyframes rollText {
    0% { opacity: 0.4; transform: translateY(-5px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  /* Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 18, 40, 0.65);
    backdrop-filter: blur(6px);
    display: none;
    justify-content: center;
    align-items: center;
    padding: 20px;
    z-index: 100;
    animation: fadeIn 0.25s ease;
  }

  .modal-overlay.show { display: flex; }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .modal {
    background: white;
    border-radius: 20px;
    padding: 32px;
    max-width: 560px;
    width: 100%;
    box-shadow: 0 25px 70px rgba(0, 0, 0, 0.4);
    animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes popIn {
    from { transform: scale(0.8); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .modal h2 {
    font-size: 1.6rem;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #ff6b6b, #5f27cd);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .modal .hint {
    color: #8395a7;
    font-size: 0.9rem;
    margin-bottom: 18px;
  }

  .modal input[type="password"],
  .modal input[type="text"],
  .modal textarea {
    width: 100%;
    padding: 14px 16px;
    border: 2px solid #c8d6e5;
    border-radius: 12px;
    font-size: 1rem;
    font-family: inherit;
    transition: border-color 0.2s;
  }

  .modal input[type="password"]:focus,
  .modal input[type="text"]:focus,
  .modal textarea:focus {
    outline: none;
    border-color: #5f27cd;
  }

  .modal .field-label {
    display: block;
    text-align: left;
    font-weight: bold;
    font-size: 0.95rem;
    color: #2f3542;
    margin-top: 14px;
    margin-bottom: 6px;
  }

  .modal .field-label:first-of-type {
    margin-top: 10px;
  }

  .modal .roster-row {
    display: flex;
    gap: 8px;
    align-items: stretch;
  }

  .modal select {
    flex: 1;
    padding: 12px 14px;
    border: 2px solid #c8d6e5;
    border-radius: 12px;
    font-size: 1rem;
    font-family: inherit;
    background: white;
    cursor: pointer;
  }

  .modal select:focus {
    outline: none;
    border-color: #5f27cd;
  }

  .modal .delete-btn {
    background: linear-gradient(135deg, #ee5a6f, #c0392b);
    padding: 0 14px;
    font-size: 1.1rem;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(238, 90, 111, 0.3);
  }

  .modal .delete-btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 8px 18px rgba(238, 90, 111, 0.5);
  }

  .modal .delete-btn:disabled {
    background: #c8d6e5;
    cursor: not-allowed;
    box-shadow: none;
  }

  .modal textarea {
    min-height: 180px;
    resize: vertical;
  }

  .modal .error {
    color: #ee5a6f;
    font-size: 0.9rem;
    margin-top: 10px;
    min-height: 1.2em;
  }

  .modal .modal-buttons {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 20px;
    flex-wrap: wrap;
  }

  .modal-buttons button {
    padding: 12px 24px;
    font-size: 1rem;
  }

  .cancel-btn {
    background: linear-gradient(135deg, #8395a7, #576574);
  }

  .cancel-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(131, 149, 167, 0.5);
  }

  .confirm-btn {
    background: linear-gradient(135deg, #1dd1a1, #10ac84);
  }

  .confirm-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(29, 209, 161, 0.5);
  }

  .export-btn {
    background: linear-gradient(135deg, #48dbfb, #0abde3);
  }

  .export-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(72, 219, 251, 0.5);
  }

  .import-btn {
    background: linear-gradient(135deg, #feca57, #ff9f43);
  }

  .import-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(254, 202, 87, 0.5);
  }

  .count-tag {
    display: inline-block;
    background: linear-gradient(135deg, #48dbfb, #0abde3);
    color: white;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.85rem;
    margin-top: 10px;
    font-weight: bold;
  }

  @media (max-width: 520px) {
    .students-grid { grid-template-columns: repeat(2, 1fr); }
    h1 { font-size: 2rem; }
    .picked-name { font-size: 2rem; }
    .container { padding: 28px 20px; }
  }
</style>
</head>
<body>
  <div class="container">
    <h1 id="pageTitle">🎤 報告順序抽籤機</h1>
    <p class="subtitle">Let's see who goes next! ✨</p>

    <div class="students-grid" id="studentsGrid"></div>

    <div class="announcement" id="announcement">
      <p class="placeholder">👇 按下「抽籤」開始決定報告順序</p>
    </div>

    <div class="buttons">
      <button class="draw-btn" id="drawBtn">🎲 抽籤</button>
      <button class="clear-btn" id="clearBtn">🔄 清除重來</button>
      <button class="input-btn" id="inputBtn">📝 輸入報告人員</button>
    </div>

    <div class="order-list" id="orderList">
      <strong>已報告順序：</strong> <span id="orderText">（尚未開始）</span>
    </div>
  </div>

  <!-- Names input modal -->
  <div class="modal-overlay" id="namesModal">
    <div class="modal">
      <h2>📝 輸入報告人員</h2>

      <label class="field-label" for="rosterSelect">切換已儲存的清單</label>
      <div class="roster-row">
        <select id="rosterSelect"></select>
        <button type="button" class="delete-btn" id="deleteRosterBtn" title="刪除目前的清單">🗑</button>
      </div>

      <label class="field-label" for="titleInput">首頁標題（同時做為儲存的清單名稱）</label>
      <input type="text" id="titleInput" placeholder="西勝AI讀書會-報告順序抽籤" maxlength="40" />

      <label class="field-label" for="namesInput">報告人員名單</label>
      <p class="hint">每位人員用半形逗號「,」分開，例如：<code>Wes, Anne, Pushy</code></p>
      <textarea id="namesInput" placeholder="Anne, Barry, Stanley, Wells, Zoe, Grace Chen, Grace Ke, Fanny, Terry, David, Rex"></textarea>
      <div class="count-tag" id="countTag">目前 0 人</div>
      <div class="error" id="namesError"></div>
      <div class="modal-buttons">
        <button class="cancel-btn" id="namesCancelBtn">取消</button>
        <button class="export-btn" id="exportBtn">📤 匯出</button>
        <button class="import-btn" id="importBtn">📥 匯入</button>
        <button class="confirm-btn" id="namesConfirmBtn">確認送出</button>
      </div>
      <input type="file" id="importFile" accept="application/json,.json" style="display:none" />
    </div>
  </div>

<script>
  const DEFAULT_TITLE = "西勝AI讀書會-報告順序抽籤";
  const DEFAULT_STUDENTS = ["Anne", "Barry", "Stanley", "Wells", "Zoe", "Grace Chen", "Grace Ke", "Fanny", "Terry", "David", "Rex"];
  const PALETTE = [
    ["#ff6b6b", "#ee5a6f"],
    ["#feca57", "#ff9f43"],
    ["#48dbfb", "#0abde3"],
    ["#1dd1a1", "#10ac84"],
    ["#5f27cd", "#341f97"],
    ["#ff9ff3", "#f368e0"],
    ["#ff7f50", "#ff6348"],
    ["#7bed9f", "#2ed573"],
    ["#70a1ff", "#1e90ff"],
    ["#eccc68", "#ffa502"],
    ["#a29bfe", "#6c5ce7"],
    ["#fd79a8", "#e84393"]
  ];

  let rosters = loadRosters();
  let pageTitle = loadCurrentTitle();
  if (!rosters[pageTitle]) rosters[pageTitle] = [...DEFAULT_STUDENTS];
  let STUDENTS = [...rosters[pageTitle]];
  let remaining = [...STUDENTS];
  let pickedOrder = [];

  function loadRosters() {
    try {
      const saved = JSON.parse(localStorage.getItem("rosters") || "null");
      if (saved && typeof saved === "object" && !Array.isArray(saved)) return saved;
    } catch (e) {}
    // Migrate from old single-roster format
    try {
      const oldNames = JSON.parse(localStorage.getItem("presenters") || "null");
      const oldTitle = localStorage.getItem("pageTitle");
      if (Array.isArray(oldNames) && oldNames.length > 0) {
        const title = (oldTitle && oldTitle.trim()) ? oldTitle : DEFAULT_TITLE;
        const migrated = { [title]: oldNames };
        localStorage.setItem("rosters", JSON.stringify(migrated));
        localStorage.setItem("currentTitle", title);
        localStorage.removeItem("presenters");
        localStorage.removeItem("pageTitle");
        return migrated;
      }
    } catch (e) {}
    return { [DEFAULT_TITLE]: [...DEFAULT_STUDENTS] };
  }

  function saveRosters() {
    try { localStorage.setItem("rosters", JSON.stringify(rosters)); } catch (e) {}
  }

  function loadCurrentTitle() {
    try {
      const saved = localStorage.getItem("currentTitle");
      if (saved && saved.trim()) return saved;
    } catch (e) {}
    return DEFAULT_TITLE;
  }

  function saveCurrentTitle() {
    try { localStorage.setItem("currentTitle", pageTitle); } catch (e) {}
  }

  function applyTitle() {
    const el = document.getElementById("pageTitle");
    el.textContent = "🎤 " + pageTitle;
    document.title = pageTitle;
  }

  function speak(text) {
    if (!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = "en-US";
    utter.rate = 0.95;
    utter.pitch = 1.1;
    utter.volume = 1;
    const voices = window.speechSynthesis.getVoices();
    const preferred = voices.find(v => /en-US/i.test(v.lang) && /female|samantha|zira|google us/i.test(v.name))
      || voices.find(v => /en-US/i.test(v.lang))
      || voices.find(v => /^en/i.test(v.lang));
    if (preferred) utter.voice = preferred;
    window.speechSynthesis.speak(utter);
  }

  if ("speechSynthesis" in window) {
    window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
  }

  const grid = document.getElementById("studentsGrid");
  const announcement = document.getElementById("announcement");
  const drawBtn = document.getElementById("drawBtn");
  const clearBtn = document.getElementById("clearBtn");
  const inputBtn = document.getElementById("inputBtn");
  const orderText = document.getElementById("orderText");

  const namesModal = document.getElementById("namesModal");
  const namesInput = document.getElementById("namesInput");
  const namesError = document.getElementById("namesError");
  const titleInput = document.getElementById("titleInput");
  const countTag = document.getElementById("countTag");
  const namesCancelBtn = document.getElementById("namesCancelBtn");
  const namesConfirmBtn = document.getElementById("namesConfirmBtn");
  const rosterSelect = document.getElementById("rosterSelect");
  const deleteRosterBtn = document.getElementById("deleteRosterBtn");
  const exportBtn = document.getElementById("exportBtn");
  const importBtn = document.getElementById("importBtn");
  const importFile = document.getElementById("importFile");

  function renderStudents() {
    grid.innerHTML = "";
    STUDENTS.forEach((name, i) => {
      const card = document.createElement("div");
      card.className = "student-card";
      const [c1, c2] = PALETTE[i % PALETTE.length];
      card.style.background = `linear-gradient(135deg, ${c1}, ${c2})`;
      const isPresented = pickedOrder.includes(name);
      if (isPresented) card.classList.add("presented");
      const index = pickedOrder.indexOf(name);
      card.innerHTML = escapeHtml(name) + (isPresented ? `<span class="badge">第 ${index + 1} 位 ✓</span>` : "");
      grid.appendChild(card);
    });
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function updateOrder() {
    orderText.textContent = pickedOrder.length
      ? pickedOrder.map((n, i) => `${i + 1}. ${n}`).join("　→　")
      : "（尚未開始）";
  }

  function resetAnnouncement() {
    announcement.className = "announcement";
    announcement.innerHTML = '<p class="placeholder">👇 按下「抽籤」開始決定報告順序</p>';
  }

  function showFinished() {
    announcement.className = "announcement finished";
    announcement.innerHTML = `
      <div class="picked-name">🎉 全部完成！</div>
      <p class="message">所有同學都已經報告完畢，辛苦了！</p>
    `;
    drawBtn.disabled = true;
  }

  function drawOne() {
    if (remaining.length === 0) return;

    drawBtn.disabled = true;
    clearBtn.disabled = true;
    announcement.className = "announcement active";
    announcement.innerHTML = `
      <div class="picked-name rolling" id="rollingName">?</div>
      <p class="message">抽籤中...</p>
    `;

    const rollingEl = document.getElementById("rollingName");
    let rollCount = 0;
    const totalRolls = 20;

    const rollInterval = setInterval(() => {
      rollingEl.textContent = remaining[Math.floor(Math.random() * remaining.length)];
      rollCount++;
      if (rollCount >= totalRolls) {
        clearInterval(rollInterval);
        finalizePick();
      }
    }, 80);

    function finalizePick() {
      const idx = Math.floor(Math.random() * remaining.length);
      const picked = remaining.splice(idx, 1)[0];
      pickedOrder.push(picked);

      announcement.innerHTML = `
        <div class="picked-name">🌟 ${escapeHtml(picked)} 🌟</div>
        <p class="message">Let's welcome <strong>${escapeHtml(picked)}</strong> to share how you put AI into action!</p>
      `;

      speak(`Let's welcome ${picked} to share how you put AI into action!`);

      renderStudents();
      updateOrder();
      clearBtn.disabled = false;

      if (remaining.length === 0) {
        setTimeout(showFinished, 2500);
      } else {
        drawBtn.disabled = false;
      }
    }
  }

  function clearAll() {
    if ("speechSynthesis" in window) window.speechSynthesis.cancel();
    remaining = [...STUDENTS];
    pickedOrder = [];
    drawBtn.disabled = false;
    clearBtn.disabled = false;
    renderStudents();
    updateOrder();
    resetAnnouncement();
  }

  // Modal helpers
  function openNamesModal() {
    renderRosterSelect(pageTitle);
    titleInput.value = pageTitle;
    namesInput.value = STUDENTS.join(", ");
    namesError.textContent = "";
    updateCountTag();
    updateDeleteBtnState();
    namesModal.classList.add("show");
    setTimeout(() => titleInput.focus(), 50);
  }

  function renderRosterSelect(selected) {
    rosterSelect.innerHTML = "";
    const titles = Object.keys(rosters);
    titles.forEach(t => {
      const opt = document.createElement("option");
      opt.value = t;
      opt.textContent = `${t}（${rosters[t].length} 人）`;
      if (t === selected) opt.selected = true;
      rosterSelect.appendChild(opt);
    });
    const newOpt = document.createElement("option");
    newOpt.value = "__new__";
    newOpt.textContent = "── 全新建立 ──";
    rosterSelect.appendChild(newOpt);
  }

  function updateDeleteBtnState() {
    const titles = Object.keys(rosters);
    deleteRosterBtn.disabled = titles.length <= 1 || rosterSelect.value === "__new__";
  }

  function onRosterSelectChange() {
    const v = rosterSelect.value;
    if (v === "__new__") {
      titleInput.value = "";
      namesInput.value = "";
      titleInput.focus();
    } else if (rosters[v]) {
      titleInput.value = v;
      namesInput.value = rosters[v].join(", ");
    }
    namesError.textContent = "";
    updateCountTag();
    updateDeleteBtnState();
  }

  function deleteCurrentRoster() {
    const v = rosterSelect.value;
    if (v === "__new__" || !rosters[v]) return;
    if (Object.keys(rosters).length <= 1) return;
    if (!confirm(`確定要刪除清單「${v}」？此操作無法復原。`)) return;
    delete rosters[v];
    saveRosters();
    const nextTitle = Object.keys(rosters)[0];
    renderRosterSelect(nextTitle);
    titleInput.value = nextTitle;
    namesInput.value = rosters[nextTitle].join(", ");
    namesError.textContent = "";
    updateCountTag();
    updateDeleteBtnState();
  }

  function closeNamesModal() {
    namesModal.classList.remove("show");
  }

  function parseNames(raw) {
    return raw.split(",").map(s => s.trim()).filter(s => s.length > 0);
  }

  function updateCountTag() {
    const names = parseNames(namesInput.value);
    countTag.textContent = `目前 ${names.length} 人`;
  }

  function exportRosters() {
    const payload = {
      app: "presentation-order-selector",
      version: 1,
      exportedAt: new Date().toISOString(),
      currentTitle: pageTitle,
      rosters
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const stamp = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = `presenters-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    namesError.style.color = "#10ac84";
    namesError.textContent = "✓ 已匯出 JSON 檔";
    setTimeout(() => { namesError.textContent = ""; namesError.style.color = ""; }, 2500);
  }

  function onImportFile(e) {
    const file = e.target.files && e.target.files[0];
    importFile.value = "";
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        const imported = data && typeof data === "object" && data.rosters;
        if (!imported || typeof imported !== "object" || Array.isArray(imported)) {
          throw new Error("檔案內容不正確（找不到 rosters 物件）");
        }
        const cleaned = {};
        let count = 0;
        for (const [title, members] of Object.entries(imported)) {
          if (!title || typeof title !== "string") continue;
          if (!Array.isArray(members)) continue;
          const names = [...new Set(members.filter(n => typeof n === "string" && n.trim()).map(n => n.trim()))];
          if (names.length >= 2) { cleaned[title] = names; count++; }
        }
        if (count === 0) throw new Error("沒有可匯入的有效清單（每份至少 2 人）");

        const replaceAll = confirm(
          `準備匯入 ${count} 份清單。\n\n` +
          `按「確定」= 取代目前所有清單\n` +
          `按「取消」= 與目前清單合併（同名會被匯入版本覆蓋）`
        );
        if (replaceAll) {
          rosters = cleaned;
        } else {
          for (const [t, n] of Object.entries(cleaned)) rosters[t] = n;
        }
        const nextTitle = (data.currentTitle && rosters[data.currentTitle]) ? data.currentTitle : Object.keys(rosters)[0];
        pageTitle = nextTitle;
        STUDENTS = [...rosters[nextTitle]];
        saveRosters();
        saveCurrentTitle();
        applyTitle();
        renderRosterSelect(pageTitle);
        titleInput.value = pageTitle;
        namesInput.value = STUDENTS.join(", ");
        updateCountTag();
        updateDeleteBtnState();
        clearAll();
        namesError.style.color = "#10ac84";
        namesError.textContent = `✓ 已匯入 ${count} 份清單`;
        setTimeout(() => {
          namesError.textContent = "";
          namesError.style.color = "";
          closeNamesModal();
        }, 1500);
      } catch (err) {
        namesError.style.color = "";
        namesError.textContent = "匯入失敗：" + err.message;
      }
    };
    reader.onerror = () => {
      namesError.style.color = "";
      namesError.textContent = "讀取檔案失敗";
    };
    reader.readAsText(file);
  }

  function submitNames() {
    const names = parseNames(namesInput.value);
    if (names.length < 2) {
      namesError.textContent = "至少需要 2 位報告人員";
      return;
    }
    const unique = [...new Set(names)];
    if (unique.length !== names.length) {
      namesError.textContent = "有重複的人名，請檢查";
      return;
    }
    const newTitle = titleInput.value.trim() || DEFAULT_TITLE;
    rosters[newTitle] = unique;
    saveRosters();
    pageTitle = newTitle;
    saveCurrentTitle();
    applyTitle();
    STUDENTS = [...unique];
    closeNamesModal();
    clearAll();
  }

  // Events
  drawBtn.addEventListener("click", drawOne);
  clearBtn.addEventListener("click", clearAll);
  inputBtn.addEventListener("click", openNamesModal);

  namesCancelBtn.addEventListener("click", closeNamesModal);
  namesConfirmBtn.addEventListener("click", submitNames);
  namesInput.addEventListener("input", updateCountTag);
  namesInput.addEventListener("keydown", e => {
    if (e.key === "Escape") closeNamesModal();
  });
  titleInput.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); namesInput.focus(); }
    if (e.key === "Escape") closeNamesModal();
  });
  rosterSelect.addEventListener("change", onRosterSelectChange);
  deleteRosterBtn.addEventListener("click", deleteCurrentRoster);
  exportBtn.addEventListener("click", exportRosters);
  importBtn.addEventListener("click", () => importFile.click());
  importFile.addEventListener("change", onImportFile);

  namesModal.addEventListener("click", e => {
    if (e.target === namesModal) namesModal.classList.remove("show");
  });

  applyTitle();
  renderStudents();
  updateOrder();
</script>
</body>
</html>
